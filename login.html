<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Grade 7 Coding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">GRADE 7 &middot; CODING COURSE</div>
      <h1 class="login-title">Sign in to continue</h1>
      <p class="login-sub">Enter the name and password your teacher gave you.</p>

      <div class="login-error" id="login-error">Incorrect username or password. Please try again.</div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary login-submit">Sign In</button>
      </form>

      <div class="teacher-link"><a href="#" id="teacher-hint">Teacher? Use your teacher account here too.</a></div>
      <div class="teacher-link"><a href="index.html">&larr; Back to course overview</a></div>
      <div class="login-foot">Grade 7 Coding — self-paced course. Trouble signing in? Ask your teacher.</div>
    </div>
  </div>

  <script src="js/students-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // If already logged in, skip straight to the right place.
    (function () {
      const s = auth_getSession();
      if (s && s.type === "student") window.location.href = "student-dashboard.html";
      if (s && s.type === "teacher") window.location.href = "teacher-dashboard.html";
    })();

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const result = auth_tryLogin(username, password);
      const errBox = document.getElementById("login-error");
      if (result.ok) {
        errBox.classList.remove("show");
        window.location.href = result.type === "teacher" ? "teacher-dashboard.html" : "student-dashboard.html";
      } else {
        errBox.classList.add("show");
      }
    });

    document.getElementById("teacher-hint").addEventListener("click", function (e) {
      e.preventDefault();
      alert("Teachers: sign in above using the teacher username and password set in js/students-config.js (TEACHER_ACCOUNT). You'll be taken to the Teacher Dashboard automatically.");
    });
  </script>
</body>
</html>
